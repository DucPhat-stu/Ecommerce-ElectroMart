<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Electro - Quick View</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="css/bootstrap.min.css"/>
    <link type="text/css" rel="stylesheet" href="css/slick.css"/>
    <link type="text/css" rel="stylesheet" href="css/slick-theme.css"/>
    <link type="text/css" rel="stylesheet" href="css/nouislider.min.css"/>
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link type="text/css" rel="stylesheet" href="css/style.css"/>
  </head>
  <body>
    <!-- HEADER rút gọn với logo & cart -->
    <header>
      <div id="header">
        <div class="container">
          <div class="row">
            <div class="col-md-3">
              <div class="header-logo">
                <a href="index.html" class="logo">
                  <img src="./img/logo.png" alt="">
                </a>
              </div>
            </div>
            <div class="col-md-6"></div>
            <div class="col-md-3 clearfix">
              <div class="header-ctn">
                <div class="dropdown">
                  <a class="dropdown-toggle" data-toggle="dropdown" aria-expanded="true">
                    <i class="fa fa-shopping-cart"></i>
                    <span>Your Cart</span>
                    <div class="qty">0</div>
                  </a>
                  <div class="cart-dropdown">
                    <div class="cart-list"></div>
                    <div class="cart-summary"></div>
                    <div class="cart-btns">
                      <a href="cart.html">View Cart</a>
                      <a href="checkout.html">Checkout  <i class="fa fa-arrow-circle-right"></i></a>
                    </div>
                  </div>
                </div>
                <div class="menu-toggle">
                  <a href="#">
                    <i class="fa fa-bars"></i>
                    <span>Menu</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- SECTION: reuse layout của product detail -->
    <div class="section">
      <div class="container">
        <div class="row">
          <div class="col-md-5 col-md-push-2">
            <div id="product-main-img"></div>
          </div>
          <div class="col-md-2 col-md-pull-5">
            <div id="product-imgs"></div>
          </div>
          <div class="col-md-5">
            <div class="product-details">
              <h2 class="product-name">Product</h2>
              <div>
                <div class="product-rating"></div>
              </div>
              <div>
                <h3 class="product-price"></h3>
                <span class="product-available">In Stock</span>
              </div>
              <p></p>
              <div class="add-to-cart">
                <div class="qty-label">
                  Qty
                  <div class="input-number">
                    <input type="number" value="1">
                    <span class="qty-up">+</span>
                    <span class="qty-down">-</span>
                  </div>
                </div>
                <button class="add-to-cart-btn"><i class="fa fa-shopping-cart"></i> add to cart</button>
              </div>
              <ul class="product-btns">
                <li><a href="#" class="btn-add-wishlist"><i class="fa fa-heart-o"></i> add to wishlist</a></li>
              </ul>
              <a href="#" id="full-details-link">View full details</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/slick.min.js"></script>
    <script src="js/nouislider.min.js"></script>
    <script src="js/jquery.zoom.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      // Tận dụng logic loadProductPage trong app.js
      $(function () {
        // set "View full details" to product.html?id=...
        var url = new URL(window.location.href);
        var id = url.searchParams.get('id');
        if (id) {
          $('#full-details-link').attr('href', 'product.html?id=' + encodeURIComponent(id));
        }
      });
    </script>
  </body>
</html>
