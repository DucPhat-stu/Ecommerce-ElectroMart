server {
    listen 80;

    server_name localhost;

    # Cấu hình reverse proxy cho backend API
    location /api/ {
        proxy_pass http://be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded Images location
    # NOTE: Frontend template uses /img/* for static assets, so we serve uploads at /uploads/*
    location /uploads/ {
        alias /app/uploads/;
        autoindex off;
        access_log off;
        expires 30d;
    }

    # Admin Dashboard
    location /admin {
        alias /usr/share/nginx/html/fe_admin_dashboard;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Admin Dashboard static files (CSS, JS)
    location /fe_admin_dashboard {
        alias /usr/share/nginx/html/fe_admin_dashboard;
    }

    # Frontend chính (customer)
    location / {
        root /usr/share/nginx/html/fe;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
