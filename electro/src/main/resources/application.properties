spring.application.name=electro

# ============================================
# Database Configuration
# ============================================
# Default config cho local development
# Docker sẽ override bằng environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/ElectroStore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=123123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# Hibernate JPA Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.context-path=/
api.prefix=/api/v1
file.upload-dir=/app/uploads

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=b6a9f486d1b64c0fa9ad1abe3c3e9e5f8d25a1c4f84f0b52e2b7d49b1e9b6c3d
app.jwt.expiration=86400000
# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.store.electro=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
