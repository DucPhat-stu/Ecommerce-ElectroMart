spring.application.name=electro

# ==================== DATABASE CONFIGURATION ====================
# MySQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/ElectroStore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / HIBERNATE CONFIGURATION ====================
# Hibernate DDL auto (create, create-drop, validate, update, none)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==================== SERVER CONFIGURATION ====================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=

# ==================== JWT CONFIGURATION ====================
# JWT Secret Key (must be at least 256 bits for HS256)
# Change this in production environment!
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-environment-for-security}

# JWT Expiration Time (in milliseconds)
# Default: 86400000 ms = 24 hours
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================== LOGGING CONFIGURATION ====================
logging.level.root=INFO
logging.level.com.store.electro=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n