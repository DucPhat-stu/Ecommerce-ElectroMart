spring.application.name=electro

# Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# JWT Configuration
# JWT Secret Key (must be at least 256 bits for HS256)
# Change this in production environment!
app.jwt.secret=your-256-bit-secret-key-change-this-in-production-environment-for-security

# JWT Expiration Time (in milliseconds)
# Default: 86400000 ms = 24 hours
app.jwt.expiration=86400000